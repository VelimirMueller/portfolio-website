
[functions.send-contact-email]
enabled = true
# No Supabase JWT check: the caller is the database trigger, not a user. The
# function checks the shared secret in x-contact-hook-secret instead (Vault +
# function secret CONTACT_HOOK_SECRET). Deploy with this file, not --no-verify-jwt.
verify_jwt = false
import_map = "./functions/send-contact-email/deno.json"
# Uncomment to specify a custom file path to the entrypoint.
# Supported file extensions are: .ts, .js, .mjs, .jsx, .tsx
entrypoint = "./functions/send-contact-email/index.ts"
# Specifies static files to be bundled with the function. Supports glob patterns.
# For example, if you want to serve static HTML pages in your function:
# static_files = [ "./functions/send-contact-email/*.html" ]
