# Installs the Playwright browsers for e2e and visual regression (issue #81).
# Browsers cached per Playwright version. The system packages (apt, inside
# --with-deps) sometimes hang for hours on the runner (twice on 2026-10-09):
# each try gets 8 minutes, up to 3 tries. The calling step sets the overall
# timeout-minutes, because a composite step cannot set its own.
name: Install Playwright browsers
description: Restore the Playwright browser cache and install chromium and webkit with retries. The calling step must set timeout-minutes.
runs:
  using: composite
  steps:
    - name: Cache Playwright browsers
      uses: actions/cache@v6
      with:
        path: ~/.cache/ms-playwright
        key: playwright-${{ runner.os }}-${{ hashFiles('package-lock.json') }}
    - name: Install Playwright browsers
      shell: bash
      run: |
        for try in 1 2 3; do
          timeout 480 npx playwright install --with-deps chromium webkit && exit 0
          echo "::warning::Playwright install try $try failed or hung; retrying"
          # A killed apt leaves dpkg half done and its locks held; without this the
          # next try fails at once with exit 100 (seen 2026-10-10, run on PR #49).
          sudo pkill -9 -f 'apt-get|dpkg' || true
          sudo rm -f /var/lib/dpkg/lock-frontend /var/lib/dpkg/lock /var/cache/apt/archives/lock /var/lib/apt/lists/lock
          sudo dpkg --configure -a || true
        done
        echo "::error::Playwright install failed after 3 tries"
        exit 1
