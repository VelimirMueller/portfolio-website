# Shared setup for the jobs that need node_modules (issue #81): Node 24 with the
# npm cache, then a clean install from package-lock.json.
name: Node and dependencies
description: Set up Node 24 with the npm cache and run npm ci.
runs:
  using: composite
  steps:
    - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
      with:
        node-version: 24
        cache: npm
    - run: npm ci
      shell: bash
