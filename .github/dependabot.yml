# Dependabot (issue #67): version updates for the JavaScript dependencies and GitHub Actions.
# Security updates come from the repo setting "Dependabot security updates"
# and are not limited by the schedules below.
version: 2
updates:
  # "npm" is Dependabot's ecosystem name for npm, pnpm and Yarn; it reads
  # package.json and pnpm-lock.yaml and updates the pnpm lockfile.
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: "06:00"
      timezone: Europe/Berlin
    open-pull-requests-limit: 5
    # Conventional commits so commitlint accepts the messages: "chore(deps): ...".
    commit-message:
      prefix: chore(deps)
    groups:
      # One PR per week for all minor and patch bumps; majors stay separate.
      npm-minor-patch:
        update-types: [minor, patch]
      # Majors in one PR too (fewer CI runs); split it when one major breaks.
      npm-major:
        update-types: [major]
    ignore:
      # Next.js and React are pinned with "~" on purpose: a major upgrade is a
      # planned migration, not a weekly bump.
      - dependency-name: next
        update-types: [version-update:semver-major]
      - dependency-name: react
        update-types: [version-update:semver-major]
      - dependency-name: react-dom
        update-types: [version-update:semver-major]
      # @types/node follows the lowest supported Node runtime (engines.node,
      # now 22), so the type check rejects APIs that runtime does not have.
      # Raise it together with the Node runtime (issue #169).
      - dependency-name: "@types/node"
        update-types: [version-update:semver-major]
      # TypeScript 7 stays ignored on purpose (decision in issue #180, closed).
      # TS 7 is the native Go compiler and its npm package ships no compiler
      # API. These dependencies need that API and do not support TS 7 yet
      # (checked 2026-10-22):
      # - typescript-eslint 8.72 (in eslint-config-next): peer typescript >=4.8.4 <6.1.0
      # - ts-jest 29.4.15: peer typescript >=4.3 <7
      # - next build: needs experimental.useTypeScriptCli with TS 7
      # A peer override would install, but lint and Jest would break.
      # To upgrade: when `npm view typescript-eslint peerDependencies` and
      # `npm view ts-jest peerDependencies` both allow 7 (expected with the
      # TS 7.1 compiler API), delete this entry. TS 6 updates still come.
      - dependency-name: typescript
        versions: [">=7"]

  - package-ecosystem: github-actions
    # "/" covers .github/workflows; the second entry covers the local composite
    # actions, so their action versions get the same bumps (issue #81).
    directories: ["/", "/.github/actions/*"]
    schedule:
      interval: monthly
      timezone: Europe/Berlin
    open-pull-requests-limit: 3
    commit-message:
      prefix: chore(deps)
    groups:
      github-actions:
        patterns: ["*"]
