# Dependabot (issue #67): version updates for npm and GitHub Actions.
# Security updates come from the repo setting "Dependabot security updates"
# and are not limited by the schedules below.
version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: "06:00"
      timezone: Europe/Berlin
    open-pull-requests-limit: 5
    # Conventional commits so commitlint accepts the messages: "chore(deps): ...".
    commit-message:
      prefix: chore(deps)
    groups:
      # One PR per week for all minor and patch bumps; majors stay separate.
      npm-minor-patch:
        update-types: [minor, patch]
    ignore:
      # Next.js and React are pinned with "~" on purpose: a major upgrade is a
      # planned migration, not a weekly bump.
      - dependency-name: next
        update-types: [version-update:semver-major]
      - dependency-name: react
        update-types: [version-update:semver-major]
      - dependency-name: react-dom
        update-types: [version-update:semver-major]
      # @types/node follows the lowest supported Node runtime (engines.node,
      # now 22), so the type check rejects APIs that runtime does not have.
      # Raise it together with the Node runtime (issue #169).
      - dependency-name: "@types/node"
        update-types: [version-update:semver-major]
      # TypeScript 7 (native compiler) ships no compiler API. typescript-eslint
      # (peer <6.1.0) and ts-jest (peer <7) need it, and so does `next build`
      # without experimental.useTypeScriptCli. Retry when both tools support
      # TS 7 (expected with the TS 7.1 API). TS 6 updates still come (issue #180).
      - dependency-name: typescript
        versions: [">=7"]

  - package-ecosystem: github-actions
    # "/" covers .github/workflows; the second entry covers the local composite
    # actions, so their action versions get the same bumps (issue #81).
    directories: ["/", "/.github/actions/*"]
    schedule:
      interval: monthly
      timezone: Europe/Berlin
    open-pull-requests-limit: 3
    commit-message:
      prefix: chore(deps)
    groups:
      github-actions:
        patterns: ["*"]
