# Dependabot (issue #67): version updates for npm and GitHub Actions.
# Security updates come from the repo setting "Dependabot security updates"
# and are not limited by the schedules below.
version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: "06:00"
      timezone: Europe/Berlin
    open-pull-requests-limit: 5
    # Conventional commits so commitlint accepts the messages: "chore(deps): ...".
    commit-message:
      prefix: chore(deps)
    groups:
      # One PR per week for all minor and patch bumps; majors stay separate.
      npm-minor-patch:
        update-types: [minor, patch]
    ignore:
      # Next.js and React are pinned with "~" on purpose: a major upgrade is a
      # planned migration, not a weekly bump.
      - dependency-name: next
        update-types: [version-update:semver-major]
      - dependency-name: react
        update-types: [version-update:semver-major]
      - dependency-name: react-dom
        update-types: [version-update:semver-major]
      # Next.js 15.5 bundles React 19.2 for the app, so tests and Storybook stay
      # on the same 19.2 line (issue #155). 19.2.x patches still come through.
      # Remove these four entries when Next 16 lands (issue #156).
      - dependency-name: react
        versions: [">= 19.3.0"]
      - dependency-name: react-dom
        versions: [">= 19.3.0"]
      - dependency-name: "@types/react"
        versions: [">= 19.3.0"]
      - dependency-name: "@types/react-dom"
        versions: [">= 19.3.0"]

  - package-ecosystem: github-actions
    # "/" covers .github/workflows; the second entry covers the local composite
    # actions, so their action versions get the same bumps (issue #81).
    directories: ["/", "/.github/actions/*"]
    schedule:
      interval: monthly
      timezone: Europe/Berlin
    open-pull-requests-limit: 3
    commit-message:
      prefix: chore(deps)
    groups:
      github-actions:
        patterns: ["*"]
