name: live-check

# Live token check (issue #151): after Vercel reports a successful deployment
# (preview or production), compare the colours the deployed site renders with
# .figma/tokens.json. Not part of CI on PRs: it tests the deployment, not the code.
on:
  deployment_status:
  workflow_dispatch:
    inputs:
      url:
        description: Deployment URL to check (default production)
        required: false

permissions: {}

defaults:
  run:
    shell: bash

concurrency:
  group: live-check-${{ github.event.deployment.id || github.ref }}
  cancel-in-progress: true

jobs:
  live-tokens:
    # Only deployments that report a URL (Vercel does); others would fall back to
    # production while checking out a different commit.
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event.deployment_status.state == 'success' &&
       (github.event.deployment_status.environment_url != '' || github.event.deployment_status.target_url != ''))
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
    # Same pinned Playwright image as the CI jobs (issue #215): no apt, no browser download.
    container:
      image: mcr.microsoft.com/playwright:v1.64.1-noble@sha256:7852dc5a7d72f5fe458a597d690f6c42fbc8e9e26ddfa95f8e6ef552558d9bbf
      options: --ipc=host
      env:
        # HOME (/github/home) belongs to the runner user, not root, so @swc/core
        # (next-intl) refuses it as the cache for its native addon.
        SWC_NATIVE_BINDING_CACHE: /root/.cache/swc
    steps:
      # The test harness (config, spec, dependencies) comes from the default
      # branch, never from the deployed commit: a preview can be built from an
      # untrusted PR, and the job holds the bypass secret.
      - name: Check out the default branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.repository.default_branch }}
          fetch-depth: 0
          persist-credentials: false
      # Only the tokens come from the deployed commit, as data, so they match
      # what was built. No silent fallback: unreadable or invalid tokens fail.
      - name: Use the deployed commit's tokens
        if: github.event_name == 'deployment_status'
        env:
          DEPLOY_SHA: ${{ github.event.deployment.sha }}
        shell: bash
        run: |
          set -euo pipefail
          # The container runs as root, the checkout belongs to the runner user.
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
          tmp="$(mktemp)"
          trap 'rm -f "$tmp"' EXIT
          git show "$DEPLOY_SHA:.figma/tokens.json" > "$tmp"
          # node, not jq: the Playwright image has no jq.
          node -e 'const t = JSON.parse(require("fs").readFileSync(process.argv[1], "utf8")); if (!(t.collections?.color && t.collections?.primitive)) process.exit(1)' "$tmp"
          mv "$tmp" .figma/tokens.json
      # node-deps runs pnpm/action-setup, setup-node and pnpm install --frozen-lockfile.
      # `./` on purpose: the action comes from the default-branch checkout above, not from the
      # deployed commit that `$/` would resolve to for a deployment_status run.
      - name: Install Node and the dependencies
        uses: ./.github/actions/node-deps # zizmor: ignore[self-repository]
      # Vercel Deployment Protection answers every deployment URL with a 302 to
      # vercel.com/sso-api. Production is checked on the public domain (the
      # config default); a preview needs the bypass secret, else it is skipped.
      - name: Pick the URL to check
        id: target
        env:
          ENVIRONMENT: ${{ github.event.deployment_status.environment || github.event.deployment.environment }}
          DEPLOY_URL: ${{ github.event.deployment_status.environment_url || github.event.deployment_status.target_url || inputs.url }}
          HAS_BYPASS: ${{ secrets.VERCEL_AUTOMATION_BYPASS_SECRET != '' }}
        run: |
          if [ "$GITHUB_EVENT_NAME" = "workflow_dispatch" ]; then
            echo "url=$DEPLOY_URL" >> "$GITHUB_OUTPUT"
          elif [ "$ENVIRONMENT" = "Production" ]; then
            echo "url=" >> "$GITHUB_OUTPUT"
          elif [ "$HAS_BYPASS" = "true" ]; then
            echo "url=$DEPLOY_URL" >> "$GITHUB_OUTPUT"
          else
            echo "::notice::Preview $DEPLOY_URL is behind Deployment Protection and VERCEL_AUTOMATION_BYPASS_SECRET is not set; the live token check is skipped."
            echo "skip=true" >> "$GITHUB_OUTPUT"
          fi
      # The Vercel Firewall can answer a runner with HTTP 429 and
      # x-vercel-mitigated: challenge (a JavaScript challenge, e.g. Attack
      # Challenge Mode). Headless Chromium cannot pass it, so the check could
      # never run: skip with a warning that names the cause instead of failing.
      - name: Detect a Vercel Firewall challenge
        id: firewall
        if: steps.target.outputs.skip != 'true'
        env:
          TARGET_URL: ${{ steps.target.outputs.url || 'https://www.velimir-mueller.de' }}
          VERCEL_AUTOMATION_BYPASS_SECRET: ${{ secrets.VERCEL_AUTOMATION_BYPASS_SECRET }}
        shell: bash
        run: |
          set -euo pipefail
          bypass=()
          [ -n "$VERCEL_AUTOMATION_BYPASS_SECRET" ] && bypass=(-H "x-vercel-protection-bypass: $VERCEL_AUTOMATION_BYPASS_SECRET")
          headers="$(curl -sS -o /dev/null -D - --max-time 30 "${bypass[@]}" "$TARGET_URL/de/projects" || true)"
          if grep -qi '^x-vercel-mitigated: *challenge' <<< "$headers"; then
            echo "::warning::The Vercel Firewall challenges $TARGET_URL (HTTP 429, x-vercel-mitigated: challenge); the live token check is skipped. Allow the runner in the Vercel Firewall to run it."
            echo "skip=true" >> "$GITHUB_OUTPUT"
          fi
      - name: Run the live token check
        if: steps.target.outputs.skip != 'true' && steps.firewall.outputs.skip != 'true'
        env:
          LIVE_URL: ${{ steps.target.outputs.url }}
          VERCEL_AUTOMATION_BYPASS_SECRET: ${{ secrets.VERCEL_AUTOMATION_BYPASS_SECRET }}
        run: pnpm run test:live
      - name: Upload the mismatch report
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: live-tokens
          path: test-results/live-tokens.json
          if-no-files-found: ignore
          retention-days: 7
