name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  # Fails on critical advisories in production dependencies (issue #67).
  # Reads package-lock.json only, so no npm ci. Tighten to high after M1.
  dependency-audit:
    name: Dependency Audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: npm audit --omit=dev --audit-level=critical

  lint-and-typecheck:
    name: Lint & Type Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run type-check

  # Applies supabase/migrations to a fresh local database and runs the SQL tests
  # (issue #73). Postgres only, in Docker; never touches the hosted project.
  # Runs on every PR (no path filter), so it can be a required check.
  db-migrations:
    name: Database Migrations & SQL Tests
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      # Same CLI version as the devDependency, without a full npm ci.
      - name: Read the Supabase CLI version from package-lock.json
        id: cli
        run: echo "version=$(jq -r '.packages["node_modules/supabase"].version' package-lock.json)" >> "$GITHUB_OUTPUT"
      - uses: supabase/setup-cli@v1
        with:
          version: ${{ steps.cli.outputs.version }}
      - run: bash scripts/db/test-migrations.sh

  unit-tests-and-build:
    name: Unit Tests & Build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run test:coverage
      - name: Upload coverage report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report
          path: coverage/
          retention-days: 7
      - run: npm run build

  storybook-and-visual-regression:
    name: Storybook & Visual Regression
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run build-storybook
      # Browsers cached per Playwright version. The system packages (apt, inside
      # --with-deps) sometimes hang for hours on the runner (twice on 2026-10-09):
      # each try gets 8 minutes, up to 3 tries.
      - name: Cache Playwright browsers
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('package-lock.json') }}
      - name: Install Playwright browsers
        timeout-minutes: 26
        run: |
          for try in 1 2 3; do
            timeout 480 npx playwright install --with-deps chromium webkit && exit 0
            echo "::warning::Playwright install try $try failed or hung; retrying"
            # A killed apt leaves dpkg half done and its locks held; without this the
            # next try fails at once with exit 100 (seen 2026-10-10, run on PR #49).
            sudo pkill -9 -f 'apt-get|dpkg' || true
            sudo rm -f /var/lib/dpkg/lock-frontend /var/lib/dpkg/lock /var/cache/apt/archives/lock /var/lib/apt/lists/lock
            sudo dpkg --configure -a || true
          done
          exit 1
      - name: Run visual regression tests
        run: npm run test:visual
      - name: Upload visual diff results
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: visual-regression-results
          path: |
            test-results/
            playwright-report/
          retention-days: 7

  e2e:
    name: E2E Tests
    runs-on: ubuntu-latest
    timeout-minutes: 45
    needs: unit-tests-and-build
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      # Browsers cached per Playwright version. The system packages (apt, inside
      # --with-deps) sometimes hang for hours on the runner (twice on 2026-10-09):
      # each try gets 8 minutes, up to 3 tries.
      - name: Cache Playwright browsers
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('package-lock.json') }}
      - name: Install Playwright browsers
        timeout-minutes: 26
        run: |
          for try in 1 2 3; do
            timeout 480 npx playwright install --with-deps chromium webkit && exit 0
            echo "::warning::Playwright install try $try failed or hung; retrying"
            # A killed apt leaves dpkg half done and its locks held; without this the
            # next try fails at once with exit 100 (seen 2026-10-10, run on PR #49).
            sudo pkill -9 -f 'apt-get|dpkg' || true
            sudo rm -f /var/lib/dpkg/lock-frontend /var/lib/dpkg/lock /var/cache/apt/archives/lock /var/lib/apt/lists/lock
            sudo dpkg --configure -a || true
          done
          exit 1
      - name: Run E2E tests
        run: npm run test:e2e
      - name: Upload test results
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: e2e-results
          path: |
            test-results/
            playwright-report/
          retention-days: 7
