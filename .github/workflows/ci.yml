# Fleet ci.yml (fleet-standard#9). The stages call fleet-workflows with the repo's own commands.
# Two jobs do work no stage covers, so they stay here (fleet.yml, WF-NAME-02):
# - db: migrations and SQL tests on a fresh local Supabase. Its job name is the required status
#   check on main, so it keeps that name until the check moves to `conclusion`.
# - visual: Storybook visual regression in the pinned Playwright image, on PRs only. Baselines
#   are rendered in that image, so it cannot run on the plain runner of a stage.
# Vercel deploys main through its Git integration, outside Actions (fleet.yml).
name: ci

on:
  pull_request:
    branches: [develop, main]
    types: [opened, synchronize, reopened, ready_for_review]
  workflow_dispatch:
    inputs:
      e2e:
        description: Run the e2e stage
        type: boolean
        default: false

permissions: {}

defaults:
  run:
    shell: bash

concurrency:
  group: ci-${{ github.event.number || github.ref }}
  cancel-in-progress: true

jobs:
  changes:
    if: ${{ !github.event.pull_request.draft }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      pull-requests: read
    outputs:
      code: ${{ github.event_name != 'pull_request' || steps.filter.outputs.code == 'true' }}
    steps:
      - name: Detect code changes
        id: filter
        if: github.event_name == 'pull_request'
        uses: dorny/paths-filter@de90cc6fb38fc0963ad72b210f1f284cd68cea36 # v3.0.2
        with:
          predicate-quantifier: every
          filters: |
            code:
              - '!**/*.md'
              - '!docs/**'
              - '!LICENSE'
              - '!.github/ISSUE_TEMPLATE/**'

  lint:
    needs: changes
    if: ${{ !failure() && !cancelled() && needs.changes.outputs.code == 'true' }}
    permissions:
      contents: read
    uses: VelimirMueller/fleet-workflows/.github/workflows/_ci-lint.yml@v0.0.1
    with:
      stack: node
      # Shell scripts (bash -n, shellcheck), the dependency audit, ESLint and the type check.
      # The stage runs the command with errexit off, so the parts are joined with &&.
      command: >-
        git ls-files -z '*.sh' | xargs -0 -r -n1 bash -n &&
        git ls-files -z '*.sh' | xargs -0 -r shellcheck --severity=warning &&
        pnpm audit --prod --audit-level critical &&
        pnpm run lint &&
        pnpm run type-check

  unit:
    needs: [changes, lint]
    if: ${{ !failure() && !cancelled() && needs.changes.outputs.code == 'true' }}
    permissions:
      contents: read
    uses: VelimirMueller/fleet-workflows/.github/workflows/_ci-unit.yml@v0.0.1
    with:
      stack: node
      # Jest; jest.config.js holds the real floor (lines 92) and writes coverage/lcov.info.
      command: pnpm run test:coverage

  e2e:
    needs: [changes, unit]
    if: ${{ !failure() && !cancelled() && github.event_name == 'workflow_dispatch' && inputs.e2e }}
    permissions:
      contents: read
    uses: VelimirMueller/fleet-workflows/.github/workflows/_ci-e2e.yml@v0.0.1
    with:
      stack: node
      # playwright.config.ts builds and starts the site; the suite also runs Mobile Safari (WebKit).
      command: >-
        pnpm exec playwright install --with-deps webkit &&
        pnpm run test:e2e --reporter=list,junit

  build:
    needs: [changes, e2e]
    if: ${{ !failure() && !cancelled() && needs.changes.outputs.code == 'true' }}
    permissions:
      contents: read
    uses: VelimirMueller/fleet-workflows/.github/workflows/_ci-build.yml@v0.0.1
    with:
      stack: node

  db:
    name: Database Migrations & SQL Tests
    needs: changes
    if: ${{ !failure() && !cancelled() && needs.changes.outputs.code == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - name: Check out the source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # Same CLI version as the devDependency, without a full pnpm install.
      # Reads the resolved "  supabase@<version>:" key; fails when it is missing.
      - name: Read the Supabase CLI version from the pnpm lockfile
        id: cli
        run: |
          version=$(grep -m1 -oE '^  supabase@[0-9][^:(]*' pnpm-lock.yaml | cut -d@ -f2)
          [ -n "$version" ] || { echo "::error::no supabase entry in pnpm-lock.yaml"; exit 1; }
          echo "version=$version" >> "$GITHUB_OUTPUT"
      - name: Install the Supabase CLI
        uses: supabase/setup-cli@45a513f8c64c0bc8e0e3dfe572b5c95be85f6359 # v3.0.1
        with:
          version: ${{ steps.cli.outputs.version }}
      - name: Apply the migrations and run the SQL tests
        env:
          KEEP_DB: "1"
        run: bash scripts/db/test-migrations.sh
      # src/types/supabase.ts must match supabase/migrations (issue #187).
      - name: Check the generated Supabase types
        run: bash scripts/db/gen-types.sh --check

  visual:
    needs: changes
    if: ${{ !failure() && !cancelled() && github.event_name == 'pull_request' && needs.changes.outputs.code == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
    # Official Playwright image (issue #215): browsers and their system libraries
    # are preinstalled, so no apt and no browser download at run time. Pinned by
    # tag and digest; the tag must equal the locked @playwright/test version
    # (src/__tests__/playwright-image.test.ts). --ipc=host: Chromium needs more
    # shared memory than the Docker default of 64 MB.
    container:
      image: mcr.microsoft.com/playwright:v1.64.1-noble@sha256:7852dc5a7d72f5fe458a597d690f6c42fbc8e9e26ddfa95f8e6ef552558d9bbf
      options: --ipc=host
      env:
        # HOME (/github/home) belongs to the runner user, not root, so @swc/core
        # (next-intl) refuses it as the cache for its native addon.
        SWC_NATIVE_BINDING_CACHE: /root/.cache/swc
    steps:
      - name: Check out the source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install Node and the dependencies
        uses: ./.github/actions/node-deps # zizmor: ignore[self-repository] same checkout as this run
      - name: Build Storybook
        run: pnpm run build-storybook
      - name: Run the visual regression tests
        run: pnpm run test:visual
      - name: Upload the visual diff results
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: visual-regression-pr-${{ github.sha }}
          path: |
            test-results/
            playwright-report/
          retention-days: 7

  conclusion:
    needs: [changes, lint, unit, e2e, build, db, visual]
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions: {}
    steps:
      - name: Fail when a job failed or a required stage was skipped
        env:
          CODE: ${{ needs.changes.outputs.code }}
          RESULTS: ${{ join(needs.*.result, ' ') }}
          LINT: ${{ needs.lint.result }}
          UNIT: ${{ needs.unit.result }}
          BUILD: ${{ needs.build.result }}
          DB: ${{ needs.db.result }}
          VISUAL: ${{ needs.visual.result }}
          EVENT: ${{ github.event_name }}
        run: |
          for r in $RESULTS; do
            case "$r" in success|skipped) ;; *) echo "::error::a job ended as $r"; exit 1 ;; esac
          done
          if [ "$CODE" = "true" ]; then
            for r in "$LINT" "$UNIT" "$BUILD" "$DB"; do
              [ "$r" = "success" ] || { echo "::error::a required stage did not run"; exit 1; }
            done
            if [ "$EVENT" = "pull_request" ] && [ "$VISUAL" != "success" ]; then
              echo "::error::the visual regression job did not run"; exit 1
            fi
          fi
