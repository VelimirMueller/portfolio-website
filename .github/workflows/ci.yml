name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# Least privilege (issue #188): every job only reads the repo. Actions are pinned
# to a full commit SHA with the version as a comment; Dependabot (github-actions)
# bumps the SHA and the comment together.
permissions:
  contents: read

# A new push to a PR cancels its older run. Runs on main always finish.
concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  # Fails on critical advisories in production dependencies (issue #67).
  # Reads pnpm-lock.yaml only, so no pnpm install. Tighten to high after M1.
  dependency-audit:
    name: Dependency Audit
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
      - run: pnpm audit --prod --audit-level critical

  lint-and-typecheck:
    name: Lint & Type Check
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/node-deps
      - run: pnpm run lint
      - run: pnpm run type-check

  # Syntax and lint check for every tracked shell script (ops-control ci.shell).
  # shellcheck is preinstalled on ubuntu-latest.
  shell-scripts:
    name: Shell Scripts
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: bash -n
        run: git ls-files -z '*.sh' | xargs -0 -r -n1 bash -n
      - name: shellcheck
        run: git ls-files -z '*.sh' | xargs -0 -r shellcheck --severity=warning

  # Applies supabase/migrations to a fresh local database and runs the SQL tests
  # (issue #73). Postgres only, in Docker; never touches the hosted project.
  # Runs on every PR (no path filter), so it can be a required check.
  db-migrations:
    name: Database Migrations & SQL Tests
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      # Same CLI version as the devDependency, without a full pnpm install.
      # Reads the resolved "  supabase@<version>:" key; fails when it is missing.
      - name: Read the Supabase CLI version from pnpm-lock.yaml
        id: cli
        run: |
          version=$(grep -m1 -oE '^  supabase@[0-9][^:(]*' pnpm-lock.yaml | cut -d@ -f2)
          [ -n "$version" ] || { echo "::error::no supabase entry in pnpm-lock.yaml"; exit 1; }
          echo "version=$version" >> "$GITHUB_OUTPUT"
      - uses: supabase/setup-cli@45a513f8c64c0bc8e0e3dfe572b5c95be85f6359 # v3.0.1
        with:
          version: ${{ steps.cli.outputs.version }}
      - run: bash scripts/db/test-migrations.sh
        env:
          KEEP_DB: "1"
      # src/types/supabase.ts must match supabase/migrations (issue #187).
      - name: Check the generated Supabase types
        run: bash scripts/db/gen-types.sh --check

  unit-tests-and-build:
    name: Unit Tests & Build
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/node-deps
      - run: pnpm run test:coverage
      - name: Upload coverage report
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: coverage-report
          path: coverage/
          retention-days: 7
      - run: pnpm run build

  storybook-and-visual-regression:
    name: Storybook & Visual Regression
    runs-on: ubuntu-latest
    timeout-minutes: 30
    # Official Playwright image (issue #215): browsers and their system libraries
    # are preinstalled, so no apt and no browser download at run time. Pinned by
    # tag and digest; the tag must equal the locked @playwright/test version
    # (src/__tests__/playwright-image.test.ts). --ipc=host: Chromium needs more
    # shared memory than the Docker default of 64 MB.
    container:
      image: mcr.microsoft.com/playwright:v1.64.1-noble@sha256:7852dc5a7d72f5fe458a597d690f6c42fbc8e9e26ddfa95f8e6ef552558d9bbf
      options: --ipc=host
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/node-deps
      - run: pnpm run build-storybook
      - name: Run visual regression tests
        run: pnpm run test:visual
      - name: Upload visual diff results
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: visual-regression-results
          path: |
            test-results/
            playwright-report/
          retention-days: 7

  e2e:
    name: E2E Tests
    runs-on: ubuntu-latest
    timeout-minutes: 30
    needs: unit-tests-and-build
    # Same pinned Playwright image as the visual job.
    container:
      image: mcr.microsoft.com/playwright:v1.64.1-noble@sha256:7852dc5a7d72f5fe458a597d690f6c42fbc8e9e26ddfa95f8e6ef552558d9bbf
      options: --ipc=host
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/node-deps
      - name: Run E2E tests
        run: pnpm run test:e2e
      - name: Upload test results
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: e2e-results
          path: |
            test-results/
            playwright-report/
          retention-days: 7
