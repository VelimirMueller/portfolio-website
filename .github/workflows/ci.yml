name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  # Fails on critical advisories in production dependencies (issue #67).
  # Reads package-lock.json only, so no npm ci. Tighten to high after M1.
  dependency-audit:
    name: Dependency Audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: npm audit --omit=dev --audit-level=critical

  lint-and-typecheck:
    name: Lint & Type Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/node-deps
      - run: npm run lint
      - run: npm run type-check

  # Applies supabase/migrations to a fresh local database and runs the SQL tests
  # (issue #73). Postgres only, in Docker; never touches the hosted project.
  # Runs on every PR (no path filter), so it can be a required check.
  db-migrations:
    name: Database Migrations & SQL Tests
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      # Same CLI version as the devDependency, without a full npm ci.
      - name: Read the Supabase CLI version from package-lock.json
        id: cli
        run: echo "version=$(jq -r '.packages["node_modules/supabase"].version' package-lock.json)" >> "$GITHUB_OUTPUT"
      - uses: supabase/setup-cli@v1
        with:
          version: ${{ steps.cli.outputs.version }}
      - run: bash scripts/db/test-migrations.sh

  unit-tests-and-build:
    name: Unit Tests & Build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/node-deps
      - run: npm run test:coverage
      - name: Upload coverage report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report
          path: coverage/
          retention-days: 7
      - run: npm run build

  storybook-and-visual-regression:
    name: Storybook & Visual Regression
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/node-deps
      - run: npm run build-storybook
      # Cache + install with retries; the composite action explains the apt hang.
      - name: Install Playwright browsers
        timeout-minutes: 26
        uses: ./.github/actions/playwright-install
      - name: Run visual regression tests
        run: npm run test:visual
      - name: Upload visual diff results
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: visual-regression-results
          path: |
            test-results/
            playwright-report/
          retention-days: 7

  e2e:
    name: E2E Tests
    runs-on: ubuntu-latest
    timeout-minutes: 45
    needs: unit-tests-and-build
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/node-deps
      # Cache + install with retries; the composite action explains the apt hang.
      - name: Install Playwright browsers
        timeout-minutes: 26
        uses: ./.github/actions/playwright-install
      - name: Run E2E tests
        run: npm run test:e2e
      - name: Upload test results
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: e2e-results
          path: |
            test-results/
            playwright-report/
          retention-days: 7
